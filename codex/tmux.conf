# tmux defaults for the Codex box.

# Run login shells inside tmux so /etc/profile.d/00-codex-env.sh is sourced —
# that's how CODEX_HOME, OPENAI_API_KEY and friends reach the TUI.
set -g default-command "/bin/bash -l"

# Mouse support: essential in the browser terminal (scroll, select, resize panes).
set -g mouse on

# A ratatui TUI needs true colour to look like it does locally.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# When the browser terminal and an SSH client are attached to the same session,
# size windows to the largest client viewing them rather than the smallest
# attached one — otherwise a small window elsewhere cramps the TUI.
setw -g aggressive-resize on

# Long scrollback — agent output is verbose.
set -g history-limit 50000

# Don't renumber/rename out from under the user.
set -g allow-rename off

# Faster escape handling (the TUI reads Esc as a key, not as a prefix delay).
set -sg escape-time 10
